name: Prism V3 Stage Checks

on:
  pull_request:
    paths:
      - 'apps/prism-game-v3/**'
      - '.github/workflows/prism-v3.yml'
  push:
    branches: [main]
    paths:
      - 'apps/prism-game-v3/**'
      - '.github/workflows/prism-v3.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/prism-game-v3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run physics tests
        run: npm test

      - name: Build Vite app
        run: npm run build

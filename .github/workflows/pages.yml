name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository tests
        run: npm test
      - name: Test and build Prism V3
        working-directory: apps/prism-game-v3
        run: |
          npm ci
          npm test
          npm run build

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Prism V3 production bundle
        working-directory: apps/prism-game-v3
        run: |
          npm ci
          npm run build
      - name: Publish Prism V3 at stable Pages paths
        run: |
          rm -rf prism-v3 prism-v3-stage8-preview
          mkdir -p prism-v3 prism-v3-stage8-preview
          cp -R apps/prism-game-v3/dist/. prism-v3/
          cp -R apps/prism-game-v3/dist/. prism-v3-stage8-preview/
          rm -rf apps/prism-game-v3/node_modules
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

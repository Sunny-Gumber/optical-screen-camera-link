name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - preview/prism-v3-stage2
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run repository tests
        run: npm test
      - name: Test and build Prism V3 preview
        if: github.ref == 'refs/heads/preview/prism-v3-stage2'
        working-directory: apps/prism-game-v3
        run: |
          npm install
          npm test
          npm run build

  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.ref == 'refs/heads/preview/prism-v3-stage2'
        with:
          node-version: 22
      - name: Build Stage 2 browser preview
        if: github.ref == 'refs/heads/preview/prism-v3-stage2'
        working-directory: apps/prism-game-v3
        run: |
          npm install
          npm run build
      - name: Place Stage 2 preview at static subpath
        if: github.ref == 'refs/heads/preview/prism-v3-stage2'
        run: |
          rm -rf prism-v3-stage2-preview
          mkdir -p prism-v3-stage2-preview
          cp -R apps/prism-game-v3/dist/. prism-v3-stage2-preview/
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static repository
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

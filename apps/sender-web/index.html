<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Optical Screen-to-Camera Sender V1</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #172033; background: #f4f6f8; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; }
    main { max-width: 1100px; margin: 0 auto; }
    h1 { margin-bottom: 6px; }
    .sub { color: #5b6474; margin-top: 0; }
    .panel { background: white; border: 1px solid #dfe4ea; border-radius: 14px; padding: 18px; margin: 16px 0; }
    textarea { width: 100%; min-height: 100px; padding: 12px; font: inherit; }
    button, select { padding: 10px 14px; margin: 8px 6px 0 0; cursor: pointer; font: inherit; }
    #frameHost { display: grid; place-items: center; overflow: auto; background: #05070a; min-height: 390px; padding: 24px; border-radius: 10px; }
    #frameHost svg { width: min(86vw, 700px); height: auto; max-height: 86vh; }
    #frameHost:fullscreen { width: 100vw; height: 100vh; padding: 20px; background: #000; }
    #frameHost:fullscreen svg { width: min(92vw, 92vh); max-width: none; max-height: 92vh; }
    .stats { display: flex; flex-wrap: wrap; gap: 10px 22px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 14px; margin-top: 12px; }
    .tag { padding: 5px 8px; border-radius: 6px; background: #edf2f7; }
    .hint { color: #5b6474; line-height: 1.5; }
    a { color: #1769aa; }
  </style>
</head>
<body>
<main>
  <h1>Optical Sender V1</h1>
  <p class="sub">Slow baseline: 256×256 logical ROI · 16×16 cells · C16 colour symbols · 4 bits/cell</p>

  <section class="panel">
    <label for="message"><strong>Data to transmit</strong></label>
    <textarea id="message">HELLO OPTICAL</textarea>
    <div>
      <button id="generate">Generate Frames</button>
      <button id="previous">Previous</button>
      <button id="next">Next</button>
      <button id="play">Play</button>
      <select id="rate" aria-label="Frame rate">
        <option value="2000">0.5 fps</option>
        <option value="1000" selected>1 fps</option>
        <option value="500">2 fps</option>
      </select>
      <button id="fullscreen">Fullscreen Frame</button>
      <a href="../receiver-web/">Open Receiver</a>
    </div>
    <div id="stats" class="stats" aria-live="polite"></div>
    <p class="hint">For the first physical test use 1 fps, maximize screen brightness, press <strong>Fullscreen Frame</strong>, and keep the receiving camera facing the whole bright square.</p>
  </section>

  <section class="panel">
    <div id="frameHost"></div>
  </section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
